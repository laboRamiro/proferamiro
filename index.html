<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profe Ramiro — Laboratorio Virtual</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d5c63" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Profe Ramiro" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal-dark:   #0a3d42;
      --teal-mid:    #0d5c63;
      --teal-light:  #1a8a8a;
      --teal-bright: #2ab8b8;
      --gold:        #c9a84c;
      --text:        #e8f4f4;
      --text-muted:  #7bbfbf;
      --card-bg:     #0f4a50;
      --card-border: #1a7070;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--teal-dark);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(180deg, #061f22 0%, var(--teal-dark) 100%);
      padding: 2.5rem 1.5rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--card-border);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(42,184,184,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .logo-wrap {
      display: inline-block;
      margin-bottom: 1rem;
    }

    .logo-wrap img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid var(--gold);
      box-shadow: 0 0 30px rgba(42,184,184,0.3), 0 0 60px rgba(42,184,184,0.1);
      object-fit: cover;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.9rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--text);
      text-shadow: 0 0 20px rgba(42,184,184,0.5);
    }

    header p {
      margin-top: 0.4rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ── MAIN ── */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--teal-bright);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--card-border);
    }

    /* ── GRID DE JUEGOS ── */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 1.5rem 1rem 1.2rem;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      position: relative;
      overflow: hidden;
    }

    .game-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--teal-bright), var(--gold));
      opacity: 0;
      transition: opacity 0.2s;
    }

    .game-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 20px rgba(42,184,184,0.15);
      border-color: var(--teal-bright);
    }

    .game-card:hover::before { opacity: 1; }

    .game-card .emoji {
      font-size: 2.8rem;
      line-height: 1;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    }

    .game-card .name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }

    .game-card .desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-new    { background: rgba(42,184,184,0.2); color: var(--teal-bright); border: 1px solid var(--teal-bright); }
    .badge-pronto { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--card-border); }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.75rem;
      border-top: 1px solid var(--card-border);
      letter-spacing: 1px;
    }

    /* ── INSTALL BANNER ── */
    #install-banner {
      display: none;
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, var(--teal-mid), var(--teal-light));
      color: white;
      padding: 0.8rem 1.8rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 20px rgba(42,184,184,0.3);
      z-index: 100;
      white-space: nowrap;
      border: 1px solid var(--teal-bright);
    }

    @media (max-width: 480px) {
      header h1 { font-size: 1.5rem; }
      .games-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <img src="icons/icon-512.png" alt="Logo Profe Ramiro" />
  </div>
  <h1>Profe Ramiro</h1>
  <p>Física &amp; Matemática · Laboratorio Virtual</p>
</header>

<main>
  <p class="section-title">Juegos disponibles</p>
  <div class="games-grid">

    <!-- === AGREGAR JUEGOS: copiar un bloque <a class="game-card"> === -->

    <a class="game-card" href="https://laboramiro.github.io/juegos-fisica/arquimedes.html" target="_blank">
      <span class="emoji">🚢</span>
      <span class="name">Arquímedes</span>
      <span class="desc">Flotación y empuje</span>
      <span class="badge badge-new">Nuevo</span>
    </a>

    <a class="game-card" href="https://laboramiro.github.io/juegos-fisica/calor.html" target="_blank">
      <span class="emoji">🌡️</span>
      <span class="name">Calor</span>
      <span class="desc">Temperatura y energía</span>
    </a>

    <a class="game-card" href="https://laboramiro.github.io/juegos-fisica/circuitos.html" target="_blank">
      <span class="emoji">⚡</span>
      <span class="name">Circuitos</span>
      <span class="desc">Electricidad básica</span>
    </a>

    <a class="game-card" href="https://laboramiro.github.io/juegos-fisica/presion.html" target="_blank">
      <span class="emoji">💧</span>
      <span class="name">Presión</span>
      <span class="desc">Fluidos y presión</span>
    </a>

    <!-- Ejemplo "próximamente":
    <div class="game-card" style="opacity:0.5;cursor:default;">
      <span class="emoji">🪐</span>
      <span class="name">Gravedad</span>
      <span class="desc">Órbitas y caída libre</span>
      <span class="badge badge-pronto">Pronto</span>
    </div>
    -->

  </div>
</main>

<button id="install-banner">📲 Instalar app</button>

<footer>
  proferamiro.com.ar &nbsp;·&nbsp; Física interactiva para el aula
</footer>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('install-banner').style.display = 'block';
  });

  document.getElementById('install-banner').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      document.getElementById('install-banner').style.display = 'none';
    }
  });

  window.addEventListener('appinstalled', () => {
    document.getElementById('install-banner').style.display = 'none';
  });
</script>

</body>
</html>
